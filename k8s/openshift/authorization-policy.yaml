apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: profile-query
spec:
  selector:
    matchLabels:
      app: profile-query
  rules:
    - from:
        - source:
            principals: ["*"]
      to:
        - operation:
            methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
            paths: ["*"]

