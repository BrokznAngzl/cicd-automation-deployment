name: Deploy Istio Resources to OpenShift

on:
  workflow_dispatch:
    inputs:
      apply_gateway:
        description: 'Apply Istio Gateway'
        required: false
        default: true
        type: boolean
      apply_virtualservice:
        description: 'Apply Istio VirtualService'
        required: false
        default: true
        type: boolean
      apply_authorization_policy:
        description: 'Apply AuthorizationPolicy'
        required: false
        default: true
        type: boolean
      apply_sidecar:
        description: 'Apply Sidecar egress policy'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  deploy-istio:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install OpenShift CLI
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: latest

      - name: Log in to OpenShift
        uses: redhat-actions/oc-login@v1
        with:
          openshift_server_url: ${{ secrets.OPENSHIFT_SERVER }}
          openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}
          namespace: ${{ secrets.OPENSHIFT_NAMESPACE }}

      - name: Validate Istio manifest files
        shell: bash
        run: |
          set -euo pipefail

          for file in \
            k8s/openshift/gateway.yaml \
            k8s/openshift/virtualservice.yaml \
            k8s/openshift/authorization-policy.yaml \
            k8s/openshift/sidecar.yaml
          do
            echo "Checking $file"
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing file: $file"
              exit 1
            fi
          done

      - name: Check Istio RBAC permissions
        shell: bash
        run: |
          set -euo pipefail

          echo "========== CHECKING ISTIO RBAC =========="
          oc auth can-i get gateways.networking.istio.io
          oc auth can-i create gateways.networking.istio.io
          oc auth can-i get virtualservices.networking.istio.io
          oc auth can-i create virtualservices.networking.istio.io
          oc auth can-i get authorizationpolicies.security.istio.io
          oc auth can-i create authorizationpolicies.security.istio.io
          oc auth can-i get sidecars.networking.istio.io
          oc auth can-i create sidecars.networking.istio.io

          if ! oc auth can-i create gateways.networking.istio.io >/dev/null 2>&1; then
            echo "ERROR: Current OpenShift token does not have permission to manage Istio resources."
            echo "Grant RBAC to the user/service account before running this workflow."
            exit 1
          fi

      - name: Apply Istio manifests
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ inputs.apply_gateway }}" = "true" ]; then
            echo "========== APPLY GATEWAY =========="
            oc apply -f k8s/openshift/gateway.yaml
          fi

          if [ "${{ inputs.apply_virtualservice }}" = "true" ]; then
            echo "========== APPLY VIRTUALSERVICE =========="
            oc apply -f k8s/openshift/virtualservice.yaml
          fi

          if [ "${{ inputs.apply_authorization_policy }}" = "true" ]; then
            echo "========== APPLY AUTHORIZATION POLICY =========="
            oc apply -f k8s/openshift/authorization-policy.yaml
          fi

          if [ "${{ inputs.apply_sidecar }}" = "true" ]; then
            echo "========== APPLY SIDECAR =========="
            oc apply -f k8s/openshift/sidecar.yaml
          fi

      - name: Verify Istio resources
        shell: bash
        run: |
          set -euo pipefail

          echo "========== ISTIO RESOURCES =========="
          oc get gateway,virtualservice,authorizationpolicy,sidecar -A || true

          echo "========== INGRESSGATEWAY =========="
          oc get pods -n istio-system || true

