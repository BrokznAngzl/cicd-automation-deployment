name: Deploy Application to OpenShift

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy from GHCR (example: 1.0.0)'
        required: true
        default: latest

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize repository name for GHCR
        shell: bash
        run: echo "IMAGE_NAME_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Install OpenShift CLI
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: latest

      - name: Log in to OpenShift
        uses: redhat-actions/oc-login@v1
        with:
          openshift_server_url: ${{ secrets.OPENSHIFT_SERVER }}
          openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}
          namespace: ${{ secrets.OPENSHIFT_NAMESPACE }}

      - name: Validate manifest files
        shell: bash
        run: |
          set -euo pipefail

          for file in \
            k8s/openshift/deployment.yaml \
            k8s/openshift/service.yaml \
            k8s/openshift/route.yaml
          do
            echo "Checking $file"

            if [ ! -f "$file" ]; then
              echo "ERROR: File not found: $file"
              exit 1
            fi
          done

      - name: Apply Kubernetes manifests
        shell: bash
        run: |
          set -euo pipefail

          echo "========== APPLY DEPLOYMENT =========="
          oc apply -f k8s/openshift/deployment.yaml

          echo "========== APPLY SERVICE =========="
          oc apply -f k8s/openshift/service.yaml

          echo "========== APPLY ROUTE =========="
          oc apply -f k8s/openshift/route.yaml

      - name: Update deployment image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="ghcr.io/${IMAGE_NAME_LC}:${{ inputs.image_tag }}"

          echo "========== UPDATE IMAGE =========="
          echo "Image: $IMAGE"

          oc set image deployment/profile-query \
            profile-query="$IMAGE"

          echo "========== RESTART DEPLOYMENT =========="
          oc rollout restart deployment/profile-query

          echo "========== WAIT FOR ROLLOUT =========="
          oc rollout status deployment/profile-query --timeout=180s

          echo "========== FINAL STATUS =========="
          oc get deployment,service,route,pods

          echo "========== DEPLOYED IMAGE =========="
          oc get deployment profile-query \
            -o jsonpath='{.spec.template.spec.containers[?(@.name=="profile-query")].image}'
          echo