name: Setup Istio RBAC

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup-rbac:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install OpenShift CLI
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: latest

      - name: Log in to OpenShift
        uses: redhat-actions/oc-login@v1
        with:
          openshift_server_url: ${{ secrets.OPENSHIFT_SERVER }}
          openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}
          namespace: ${{ secrets.OPENSHIFT_NAMESPACE }}

      - name: Verify namespace and user
        shell: bash
        run: |
          set -euo pipefail
          echo "Namespace: ${OPENSHIFT_NAMESPACE:-${{ secrets.OPENSHIFT_NAMESPACE }}}"
          oc project
          oc whoami

      - name: Apply Istio RBAC
        shell: bash
        run: |
          set -euo pipefail
          NS="${{ secrets.OPENSHIFT_NAMESPACE }}"
          USER="$(oc whoami)"

          sed "s|__NAMESPACE__|${NS}|g; s|__USER__|${USER}|g" k8s/openshift/istio-rbac.yaml | oc apply -f -

      - name: Verify RBAC
        shell: bash
        run: |
          set -euo pipefail
          oc auth can-i get gateways.networking.istio.io
          oc auth can-i create gateways.networking.istio.io
          oc auth can-i get virtualservices.networking.istio.io
          oc auth can-i create virtualservices.networking.istio.io
          oc auth can-i get authorizationpolicies.security.istio.io
          oc auth can-i create authorizationpolicies.security.istio.io
          oc auth can-i get sidecars.networking.istio.io
          oc auth can-i create sidecars.networking.istio.io

